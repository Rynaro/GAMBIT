[package]
name = "gambit"
version = "0.3.2"
edition = "2021"
description = "GAMBIT — The ControlCenter where you compose the Eidolons."
license = "MIT"
repository = "https://github.com/Rynaro/GAMBIT"

[lib]
name = "gambit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
window-vibrancy = "0.7"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["process", "io-util", "rt", "macros"] }
which = "6"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
toml = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
