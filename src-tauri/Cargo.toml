[package]
name = "gambit"
version = "0.0.1"
edition = "2021"
description = "GAMBIT — The ControlCenter where you compose the Eidolons."
license = "MIT"
repository = "https://github.com/Rynaro/GAMBIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-vibrancy = "~0.7"
notify = "6"
notify-debouncer-mini = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
