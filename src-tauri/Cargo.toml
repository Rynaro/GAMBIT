[package]
name = "gambit"
version = "0.0.1"
edition = "2021"
description = "MATERIA — The ControlCenter where you equip the Eidolons."
license = "MIT"
repository = "https://github.com/Rynaro/MATERIA"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
