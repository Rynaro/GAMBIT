# the Rust extractor on first launch. The SHA must match the downloaded tarball.
# Update this file in lockstep with nexus CLI releases.
[eidolons-cli]
version = "1.3.0"
sha256 = "PLACEHOLDER_FILL_AT_FIRST_RELEASE"
